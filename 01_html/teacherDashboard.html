<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard - Project Submissions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .dashboard-header {
      background: white;
      padding: 20px 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-header h1 {
      color: #333;
      font-size: 28px;
    }

    .teacher-info {
      text-align: right;
    }

    .teacher-info p {
      color: #666;
      font-size: 14px;
    }

    .logout-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .debug-panel {
      background: #fff3cd;
      border: 2px solid #ffc107;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .debug-panel h3 {
      color: #856404;
      margin-bottom: 10px;
    }

    .debug-panel pre {
      background: white;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .filters h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .filter-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .filter-row select, .filter-row input {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      flex: 1;
      min-width: 200px;
    }

    .filter-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .filter-btn:hover {
      background: #5568d3;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .stat-card h2 {
      font-size: 36px;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-card p {
      color: #666;
      font-size: 14px;
    }

    .projects-container {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .project-item {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .project-item:hover {
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
    }

    .project-item-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .project-item-title {
      flex: 1;
    }

    .project-item-title h3 {
      color: #333;
      margin-bottom: 5px;
    }

    .project-item-title p {
      color: #999;
      font-size: 13px;
    }

    .status-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-submitted { background: #2196F3; color: white; }
    .status-reviewed { background: #FF9800; color: white; }
    .status-approved { background: #4CAF50; color: white; }
    .status-rejected { background: #F44336; color: white; }

    .student-info {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .student-info p {
      color: #555;
      font-size: 13px;
    }

    .student-info strong {
      color: #333;
    }

    .project-description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .project-links {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .project-link {
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      color: white;
      transition: all 0.3s;
    }

    .link-github { background: #24292e; }
    .link-live { background: #667eea; }
    .link-pdf { background: #dc3545; }

    .project-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .review-section {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .review-section h4 {
      color: #333;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .review-section textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 10px;
      font-family: inherit;
    }

    .review-section select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .review-section input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      width: 100px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .review-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .review-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-approve { background: #4CAF50; color: white; }
    .btn-reject { background: #F44336; color: white; }
    .btn-save { background: #2196F3; color: white; }

    .review-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .no-projects {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div>
      <h1>👨‍🏫 Teacher Dashboard</h1>
      <p>Review and manage student project submissions</p>
    </div>
    <div class="teacher-info">
      <p><strong id="teacherName">Loading...</strong></p>
      <p id="teacherEmail"></p>
      <p id="teacherDept"></p>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Debug Panel (shows what's happening) -->
  <div class="debug-panel" id="debugPanel">
    <h3>🔍 Debug Information (Remove this in production)</h3>
    <pre id="debugOutput">Loading...</pre>
  </div>

  <!-- Statistics -->
  <div class="stats">
    <div class="stat-card">
      <h2 id="totalProjects">0</h2>
      <p>Total Submissions</p>
    </div>
    <div class="stat-card">
      <h2 id="submittedProjects">0</h2>
      <p>Pending Review</p>
    </div>
    <div class="stat-card">
      <h2 id="approvedProjects">0</h2>
      <p>Approved</p>
    </div>
    <div class="stat-card">
      <h2 id="rejectedProjects">0</h2>
      <p>Rejected</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <h3>🔍 Filter Submissions</h3>
    <div class="filter-row">
      <select id="filterStatus">
        <option value="">All Statuses</option>
        <option value="submitted">Submitted</option>
        <option value="reviewed">Under Review</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      
      <select id="filterBranch">
        <option value="">All Branches</option>
        <option value="Computer Science and Engineering">Computer Science</option>
        <option value="Mechanical Engineering">Mechanical</option>
        <option value="Civil Engineering">Civil</option>
        <option value="Electrical Engineering">Electrical</option>
      </select>
      
      <select id="filterSemester">
        <option value="">All Semesters</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>
      
      <input type="text" id="filterStudent" placeholder="Search by student name or enrollment...">
      
      <button class="filter-btn" onclick="applyFilters()">Apply Filters</button>
    </div>
  </div>

  <!-- Projects List -->
  <div class="projects-container">
    <h3 style="margin-bottom: 20px; color: #333;">📚 Student Submissions</h3>
    <div id="projectsList">
      <div class="loading">Loading projects...</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { 
      auth, 
      db, 
      onAuthStateChanged,
      collection,
      getDocs,
      doc,
      updateDoc,
      query,
      where,
      getDoc
    } from '../04_DatabaseHandler/firebaseConfig.js';
    

    let teacherData = null;
    let allProjects = [];
    let debugInfo = {};

    // Debug logger
    function log(message, data = null) {
      console.log(message, data);
      debugInfo[message] = data;
      updateDebugPanel();
    }

    function updateDebugPanel() {
      document.getElementById('debugOutput').textContent = JSON.stringify(debugInfo, null, 2);
    }

    // Check if teacher is logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        log("✅ User logged in", { uid: user.uid, email: user.email });
        await loadTeacherInfo(user.uid);
        await loadAllProjects();
      } else {
        log("❌ No user logged in");
        // Uncomment to redirect:
        // window.location.href = "teacher-login.html";
        alert("Please login as a teacher first!");
      }
    });

    // Load teacher information
    async function loadTeacherInfo(uid) {
      try {
        log("📥 Loading teacher info for UID", uid);

        // METHOD 1: Search by uid field
        const teacherRef = collection(db, "TeacherEligibility");
        const q = query(teacherRef, where("uid", "==", uid));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          querySnapshot.forEach((doc) => {
            teacherData = { id: doc.id, ...doc.data() };
          });
          log("✅ Teacher found (query method)", teacherData);
        } else {
          // METHOD 2: Try direct access
          const directDocRef = doc(db, "TeacherEligibility", uid);
          const docSnap = await getDoc(directDocRef);
          if (docSnap.exists()) {
            teacherData = { id: uid, ...docSnap.data() };
            log("✅ Teacher found (direct method)", teacherData);
          } else {
            log("❌ Teacher not found in TeacherEligibility collection");
            
            // Show helpful error
            document.getElementById('projectsList').innerHTML = `
              <div class="error-message">
                <h3>⚠️ Teacher Account Not Found</h3>
                <p>Your account is not registered as a teacher.</p>
                <p><strong>Your UID:</strong> ${uid}</p>
                <p><strong>To fix:</strong> Ask admin to add your account to TeacherEligibility collection.</p>
                <pre style="background: white; padding: 10px; border-radius: 5px; margin-top: 10px;">
{
  "uid": "${uid}",
  "name": "Your Name",
  "email": "${auth.currentUser.email}",
  "department": "Computer Science",
  "canViewAll": true
}
                </pre>
              </div>
            `;
            return;
          }
        }

        // Update UI
        if (teacherData) {
          document.getElementById("teacherName").textContent = teacherData.name || "Teacher";
          document.getElementById("teacherEmail").textContent = teacherData.email || "";
          document.getElementById("teacherDept").textContent = teacherData.department || "All Departments";
        }
      } catch (error) {
        log("❌ Error loading teacher info", error.message);
        console.error("Error loading teacher info:", error);
      }
    }

    // Load all projects
    async function loadAllProjects() {
      try {
        log("📥 Loading projects...");

        if (!teacherData) {
          log("❌ Cannot load projects - teacher data not loaded");
          return;
        }

        const projectsRef = collection(db, "Projects");
        
        // Get all projects (no filtering first, to see what exists)
        log("🔍 Fetching all projects from Projects collection");
        const querySnapshot = await getDocs(projectsRef);
        
        log("📊 Projects found in database", querySnapshot.size);

        allProjects = [];
        querySnapshot.forEach((doc) => {
          allProjects.push({ id: doc.id, ...doc.data() });
        });

        log("✅ All projects loaded", { count: allProjects.length, projects: allProjects });

        // Filter by department if needed
        if (teacherData.canViewAll) {
          log("👁️ Teacher can view ALL departments");
        } else {
          const beforeFilter = allProjects.length;
          allProjects = allProjects.filter(p => p.department === teacherData.department);
          log(`🔍 Filtered by department: ${beforeFilter} → ${allProjects.length} projects`, 
              { department: teacherData.department });
        }

        // Sort by submission date (newest first)
        allProjects.sort((a, b) => {
          const dateA = new Date(a.submittedAt || 0);
          const dateB = new Date(b.submittedAt || 0);
          return dateB - dateA;
        });

        updateStatistics();
        displayProjects(allProjects);

      } catch (error) {
        log("❌ Error loading projects", error.message);
        console.error("Error loading projects:", error);
        document.getElementById("projectsList").innerHTML = `
          <div class="error-message">
            <h3>❌ Failed to Load Projects</h3>
            <p>${error.message}</p>
            <p>Check browser console for more details.</p>
          </div>
        `;
      }
    }

    // Update statistics
    function updateStatistics() {
      const stats = {
        total: allProjects.length,
        submitted: allProjects.filter(p => p.status === "submitted").length,
        approved: allProjects.filter(p => p.status === "approved").length,
        rejected: allProjects.filter(p => p.status === "rejected").length
      };

      log("📊 Statistics updated", stats);

      document.getElementById("totalProjects").textContent = stats.total;
      document.getElementById("submittedProjects").textContent = stats.submitted;
      document.getElementById("approvedProjects").textContent = stats.approved;
      document.getElementById("rejectedProjects").textContent = stats.rejected;
    }

    // Display projects
    function displayProjects(projects) {
      const projectsList = document.getElementById("projectsList");

      if (projects.length === 0) {
        projectsList.innerHTML = `
          <div class="no-projects">
            <h3>📭 No Projects Found</h3>
            <p>No student submissions yet.</p>
            <p><strong>Possible reasons:</strong></p>
            <ul style="text-align: left; display: inline-block;">
              <li>No students have submitted projects yet</li>
              <li>Projects are in a different department (you see: ${teacherData.department || 'All'})</li>
              <li>Database collection name might be different</li>
            </ul>
          </div>
        `;
        return;
      }

      let html = '';
      projects.forEach((project, index) => {
        html += createProjectHTML(project, index);
      });

      projectsList.innerHTML = html;
      log("✅ Projects displayed", projects.length);
    }

    // Create project HTML
    function createProjectHTML(project, index) {
      const submittedDate = new Date(project.submittedAt || Date.now()).toLocaleDateString('en-IN', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      return `
        <div class="project-item">
          <div class="project-item-header">
            <div class="project-item-title">
              <h3>${project.projectTitle || 'Untitled Project'}</h3>
              <p>Submitted on ${submittedDate}</p>
            </div>
            <span class="status-badge status-${project.status || 'submitted'}">${project.status || 'submitted'}</span>
          </div>

          <div class="student-info">
            <p><strong>Student:</strong> ${project.studentName || 'N/A'}</p>
            <p><strong>Enrollment:</strong> ${project.enrollmentNumber || 'N/A'}</p>
            <p><strong>Email:</strong> ${project.email || 'N/A'}</p>
            <p><strong>Mobile:</strong> ${project.mobile || 'N/A'}</p>
            <p><strong>Branch:</strong> ${project.branch || 'N/A'}</p>
            <p><strong>Semester:</strong> ${project.semester || 'N/A'}</p>
            <p><strong>Department:</strong> ${project.department || 'N/A'}</p>
            <p><strong>Year:</strong> ${project.year || 'N/A'}</p>
          </div>

          <p class="project-description">${project.projectDescription || 'No description provided'}</p>

          <div class="project-links">
            ${project.githubLink ? 
              `<a href="${project.githubLink}" target="_blank" class="project-link link-github">
                🔗 GitHub Repository
              </a>` : ''}
            ${project.liveProjectLink ? 
              `<a href="${project.liveProjectLink}" target="_blank" class="project-link link-live">
                🚀 Live Demo
              </a>` : ''}
            ${project.pdfLink || project.pdfUrl ? 
              `<a href="${project.pdfLink || project.pdfUrl}" target="_blank" class="project-link link-pdf">
                📄 View Report
              </a>` : ''}
          </div>

          <div class="review-section">
            <h4>📝 Review & Grade</h4>
            <textarea id="comment-${project.id}" placeholder="Enter your comments/feedback...">${project.teacherComment || ''}</textarea>
            
            <div style="margin-bottom: 10px;">
              <select id="status-${project.id}">
                <option value="submitted" ${project.status === 'submitted' ? 'selected' : ''}>Submitted</option>
                <option value="reviewed" ${project.status === 'reviewed' ? 'selected' : ''}>Under Review</option>
                <option value="approved" ${project.status === 'approved' ? 'selected' : ''}>Approved</option>
                <option value="rejected" ${project.status === 'rejected' ? 'selected' : ''}>Rejected</option>
              </select>
              
              <input type="text" id="grade-${project.id}" placeholder="Grade (e.g., A+)" value="${project.grade || ''}">
            </div>

            <div class="review-actions">
              <button class="review-btn btn-save" onclick="saveReview('${project.id}')">
                💾 Save Review
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Save review
    window.saveReview = async function(projectId) {
      try {
        const comment = document.getElementById(`comment-${projectId}`).value;
        const status = document.getElementById(`status-${projectId}`).value;
        const grade = document.getElementById(`grade-${projectId}`).value;

        log("💾 Saving review", { projectId, comment, status, grade });

        const projectRef = doc(db, "Projects", projectId);
        await updateDoc(projectRef, {
          teacherComment: comment,
          status: status,
          grade: grade,
          reviewedBy: teacherData.name,
          reviewedAt: new Date().toISOString(),
          lastUpdated: new Date().toISOString()
        });

        log("✅ Review saved successfully");
        alert("✅ Review saved successfully!");
        await loadAllProjects(); // Reload to update stats

      } catch (error) {
        log("❌ Error saving review", error.message);
        console.error("Error saving review:", error);
        alert("Failed to save review: " + error.message);
      }
    }

    // Apply filters
    window.applyFilters = function() {
      const statusFilter = document.getElementById("filterStatus").value;
      const branchFilter = document.getElementById("filterBranch").value;
      const semesterFilter = document.getElementById("filterSemester").value;
      const studentFilter = document.getElementById("filterStudent").value.toLowerCase();

      log("🔍 Applying filters", { statusFilter, branchFilter, semesterFilter, studentFilter });

      let filtered = allProjects.filter(project => {
        if (statusFilter && project.status !== statusFilter) return false;
        if (branchFilter && project.branch !== branchFilter) return false;
        if (semesterFilter && project.semester !== semesterFilter) return false;
        if (studentFilter && 
            !project.studentName?.toLowerCase().includes(studentFilter) &&
            !project.enrollmentNumber?.toLowerCase().includes(studentFilter)) return false;
        return true;
      });

      log("✅ Filters applied", { originalCount: allProjects.length, filteredCount: filtered.length });
      displayProjects(filtered);
    }

    // Logout
    window.logout = async function() {
      if (confirm("Are you sure you want to logout?")) {
        try {
          await auth.signOut();
          log("✅ Logged out successfully");
          window.location.href = "login.html";
        } catch (error) {
          alert("Logout failed: " + error.message);
        }
      }
    }

    // Make functions global for debugging
    window.debugTeacher = {
      teacherData: () => teacherData,
      allProjects: () => allProjects,
      reload: () => loadAllProjects()
    };

    console.log("🔍 Debug commands available:");
    console.log("- window.debugTeacher.teacherData() - See teacher info");
    console.log("- window.debugTeacher.allProjects() - See all projects");
    console.log("- window.debugTeacher.reload() - Reload projects");
  </script>

</body>
</html>
