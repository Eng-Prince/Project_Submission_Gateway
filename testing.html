<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login & Sign Up</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div class="container" id="mainContainer">
    <div class="form-container">
      <form id="projectForm" enctype="multipart/form-data">
      <input type="text" placeholder="Full Name" name="FullName" required />
      <input type="text" placeholder="Midle Name" name="MidleName" />
      <input type="text" placeholder="Last Name" name="lastName" />
      <input type="text" placeholder="Enrollment Number" name="enrollment" />
      <input type="text" placeholder="Branch" name="branch" />
      <input type="text" placeholder="Department" name="department" />
      <input type="text" placeholder="Semester" name="semester" />
      <input type="text" placeholder="Mobile Number" name="mobileNumber" />
      <input type="date" placeholder="Submit Date" name="date" />
      <textarea name="description" placeholder="Describe your project..." rows="5"></textarea>
      <input type="url" placeholder="Project URL" name="url" />

      <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf" required />
      
      <div id="previewBox" style="display:none; margin: 10px 0;">
        <embed id="pdfPreview" type="application/pdf" width="100%" height="300px" />
      </div>

      <button type="submit">Upload Project</button>
    </form>

    <div id="status"></div>
  </div>

     <script src="/js/script.js"></script>

</body>

</html>
