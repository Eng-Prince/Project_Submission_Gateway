<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Picture Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }

    .profile-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }

    /* Circular profile preview */
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2575fc;
      margin-bottom: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .profile-pic:hover {
      opacity: 0.8;
    }

    .profile-box input, .profile-box button {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .profile-box button {
      background: #2575fc;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .profile-box button:hover {
      background: #1e5fd4;
    }

    /* Hide file input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="profile-box">
    <!-- Clickable profile picture -->
    <img id="preview" src="https://via.placeholder.com/120" alt="Profile" class="profile-pic">

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept="image/*">

    <!-- Profile details -->
    <input type="text" placeholder="Enter Name">
    <input type="email" placeholder="Enter Email">

    <button>Create Profile</button>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");

    // When clicking image -> open file input
    preview.addEventListener("click", () => {
      fileInput.click();
    });

    // When selecting a file -> update image
    fileInput.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result; // show uploaded image
        };
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
